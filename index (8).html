const bank=[{"t": "8A", "q": "Which is categorical data?", "a": ["Eye colour", "Height", "Age", "Mass"], "e": "Categories are labels, not measurements."}, {"t": "8A", "q": "Which is discrete numerical data?", "a": ["Number of siblings", "Temperature", "Height", "Time"], "e": "Counts take separate whole-number values."}, {"t": "8A", "q": "Which is continuous numerical data?", "a": ["Length of a pencil", "Number of cars", "Favourite sport", "Number of pets"], "e": "Length can take any value in an interval."}, {"t": "8A", "q": "[bar] Which category has the highest frequency?", "a": ["B", "A", "C", "D"], "e": "B has the tallest column (8)."}, {"t": "8A", "q": "[line] Between which days did the value rise most?", "a": ["Tue–Wed", "Mon–Tue", "Wed–Thu", "Thu–Fri"], "e": "The rise from 3 to 9 is 6."}, {"t": "8A", "q": "[pie] What percentage chose soccer?", "a": ["50%", "25%", "10%", "75%"], "e": "Soccer occupies half the circle."}, {"t": "8A", "q": "[table] How many students are represented altogether?", "a": ["20", "8", "12", "24"], "e": "Add 4 + 8 + 5 + 3."}, {"t": "8B", "q": "Why use tally marks when collecting data?", "a": ["To keep a running count", "To calculate the mean automatically", "To measure length", "To remove outliers"], "e": "Tallies record each occurrence."}, {"t": "8B", "q": "Two complete groups of five tally marks and three single marks represent what?", "a": ["13", "10", "8", "15"], "e": "5 + 5 + 3 = 13."}, {"t": "8B", "q": "Data: 2, 3, 2, 4, 3, 2. Which frequency row is correct for values 2, 3, 4?", "a": ["3, 2, 1", "2, 3, 1", "1, 2, 3", "3, 1, 2"], "e": "Count occurrences of each value."}, {"t": "8C", "q": "[table] Which column heights correctly graph A, B, C, D?", "a": ["4, 8, 5, 3", "8, 4, 3, 5", "4, 5, 8, 3", "3, 5, 8, 4"], "e": "Each column height equals its frequency."}, {"t": "8C", "q": "Which data set is most suitable for a simple dot plot?", "a": ["Number of pets of 12 students", "Names of 1000 students", "A continuous video", "A map of Australia"], "e": "Small sets of discrete numerical data suit dot plots."}, {"t": "8C", "q": "[dot] What is the mode of this dot plot?", "a": ["2", "1", "3", "4"], "e": "There are four dots above 2, the most frequent value."}, {"t": "8C", "q": "Data: 1, 1, 2, 3, 3, 3. How many dots should appear above 3?", "a": ["3", "1", "2", "6"], "e": "Each occurrence is represented by one dot."}, {"t": "8D", "q": "What is the mean of 3, 5, 7, 9?", "a": ["6", "5", "7", "24"], "e": "24 divided by 4 is 6."}, {"t": "8D", "q": "What is the median of 2, 9, 4, 7?", "a": ["5.5", "4", "7", "6"], "e": "Order the data and average 4 and 7."}, {"t": "8D", "q": "What is the mode of 1, 3, 3, 5, 7?", "a": ["3", "5", "1", "7"], "e": "3 occurs twice."}, {"t": "8D", "q": "In 2, 3, 4, 5, 6, replace 6 with 100. Which measure changes more?", "a": ["Mean", "Median", "Both equally", "Neither"], "e": "The mean is sensitive to extreme values; the median remains 4."}, {"t": "8E", "q": "What is the range of 4, 7, 10, 15?", "a": ["11", "15", "19", "7"], "e": "15 − 4 = 11."}, {"t": "8E", "q": "For 1, 2, 3, 4, 5, 6, 7, 8, what is the IQR?", "a": ["4", "7", "5", "3"], "e": "Q1 = 2.5, Q3 = 6.5; difference = 4."}, {"t": "8E", "q": "What does the IQR measure?", "a": ["Spread of the middle 50%", "Average of all values", "Most frequent value", "Total spread from minimum to maximum"], "e": "IQR = Q3 − Q1."}, {"t": "8E", "q": "If only the largest value becomes much larger in a set of 20 ordered values, which measure changes?", "a": ["Range", "IQR", "Median", "Lower quartile"], "e": "The maximum increases while the quartiles stay the same."}, {"t": "8G", "q": "Which is a valid probability?", "a": ["0.75", "1.5", "−0.2", "2"], "e": "Probabilities lie between 0 and 1."}, {"t": "8G", "q": "What is the sample space for one fair coin toss?", "a": ["Heads, tails", "Heads only", "Tails only", "Two heads"], "e": "The sample space lists every possible outcome."}, {"t": "8G", "q": "A die is rolled once. What is that single roll called?", "a": ["Trial", "Complement", "Sample space", "Population"], "e": "A trial is one performance of an experiment."}, {"t": "8G", "q": "What is the probability of rolling an even number on a fair six-sided die?", "a": ["1/2", "1/6", "2/3", "1/3"], "e": "Three of six outcomes are even."}, {"t": "8G", "q": "If P(rain) = 0.3, what is P(no rain)?", "a": ["0.7", "0.3", "1.3", "0"], "e": "Complementary probabilities sum to 1."}, {"t": "8G", "q": "Which describes the event of rolling greater than 4?", "a": ["{5, 6}", "{4, 5, 6}", "{1, 2, 3, 4}", "{6}"], "e": "An event is a set of outcomes meeting a condition."}, {"t": "10A", "q": "What is a reflection?", "a": ["A flip across a mirror line", "A slide", "A turn", "An enlargement"], "e": "Reflection creates a mirror image."}, {"t": "10A", "q": "Which property is preserved by reflection?", "a": ["Side lengths and angles", "Only position", "Only colour", "Neither length nor angle"], "e": "Reflection is isometric."}, {"t": "10A", "q": "Reflect (3, −2) across the y-axis.", "a": ["(−3, −2)", "(3, 2)", "(−3, 2)", "(2, 3)"], "e": "Reflection across y-axis changes the sign of x."}, {"t": "10A", "q": "[shape] Which vertices are the reflection across the y-axis?", "a": ["(-1,1), (-3,1), (-1,3)", "(1,-1), (3,-1), (1,-3)", "(-1,-1), (-3,-1), (-1,-3)", "(2,1), (4,1), (2,3)"], "e": "Negate each x-coordinate."}, {"t": "10A", "q": "How many lines of symmetry does a non-square rectangle have?", "a": ["2", "4", "1", "0"], "e": "Horizontal and vertical centre lines reflect it onto itself."}, {"t": "10B", "q": "What movement does vector (−2, 4) describe?", "a": ["Left 2, up 4", "Right 2, up 4", "Left 4, up 2", "Left 2, down 4"], "e": "The first component is horizontal; the second vertical."}, {"t": "10B", "q": "A(1, 2) moves to A′(4, −1). What is the vector?", "a": ["(3, −3)", "(5, 1)", "(−3, 3)", "(3, 3)"], "e": "Subtract original coordinates from image coordinates."}, {"t": "10B", "q": "[shape] Translate the triangle by (2, −1). Which vertices result?", "a": ["(3,0), (5,0), (3,2)", "(−1,2), (1,2), (−1,4)", "(3,2), (5,2), (3,4)", "(1,3), (3,3), (1,5)"], "e": "Add 2 to x and subtract 1 from y."}, {"t": "10C", "q": "Rotate (2, 3) 90° clockwise around the origin.", "a": ["(3, −2)", "(−3, 2)", "(−2, −3)", "(2, −3)"], "e": "Clockwise 90° maps (x,y) to (y,−x)."}, {"t": "10C", "q": "Rotate (2, 3) 90° anticlockwise around the origin.", "a": ["(−3, 2)", "(3, −2)", "(−2, −3)", "(3, 2)"], "e": "Anticlockwise 90° maps (x,y) to (−y,x)."}, {"t": "10C", "q": "What is the order of rotational symmetry of a square?", "a": ["4", "2", "1", "8"], "e": "It matches itself four times in a full turn."}, {"t": "10C", "q": "[shape] Rotate the triangle 180° around the origin. Which vertices result?", "a": ["(-1,-1), (-3,-1), (-1,-3)", "(1,-1), (3,-1), (1,-3)", "(-1,1), (-3,1), (-1,3)", "(1,1), (3,1), (1,3)"], "e": "A half-turn negates both coordinates."}, {"t": "10C", "q": "A point (4, 2) rotates 180° around (1, 1). Where does it land?", "a": ["(−2, 0)", "(−4, −2)", "(0, −2)", "(2, 0)"], "e": "The centre is the midpoint between original and image."}, {"t": "10D", "q": "Which transformations always preserve congruence?", "a": ["Reflection, translation and rotation", "Enlargement by factor 2", "Stretching horizontally", "Changing one angle"], "e": "Rigid transformations preserve size and shape."}, {"t": "10D", "q": "If ABC ≅ DEF, which side corresponds to BC?", "a": ["EF", "DE", "DF", "AB"], "e": "The order of vertices gives B↔E and C↔F."}, {"t": "10D", "q": "If ABC ≅ DEF, which angle corresponds to angle A?", "a": ["Angle D", "Angle E", "Angle F", "Angle B"], "e": "First vertices correspond."}, {"t": "10E", "q": "Two triangles have matching sides 3, 4, 5. Which test proves congruence?", "a": ["SSS", "SAS", "AAS", "RHS only"], "e": "All three corresponding sides are equal."}, {"t": "10E", "q": "Two sides and their included angle match. Which test applies?", "a": ["SAS", "SSS", "AAS", "AAA"], "e": "SAS requires the angle between the known sides."}, {"t": "10E", "q": "Two angles and one corresponding side match. Which test applies?", "a": ["AAS", "SSS", "SAS", "AAA"], "e": "Two angles and a side fix shape and size."}, {"t": "10E", "q": "Two right triangles have equal hypotenuses and one equal corresponding leg. Which test applies?", "a": ["RHS", "AAA", "SSS only", "SAS only"], "e": "RHS uses right angle, hypotenuse and side."}, {"t": "10E", "q": "Which description guarantees a unique triangle?", "a": ["Sides 4 cm, 5 cm, 6 cm", "One side 4 cm", "Angles 40°, 60°, 80°", "Two sides 4 cm and 5 cm only"], "e": "Three valid side lengths determine a unique triangle."}, {"t": "10E", "q": "Which description cannot form a triangle?", "a": ["Sides 2, 3, 6", "Sides 3, 4, 5", "Sides 4, 4, 5", "Sides 5, 5, 5"], "e": "The two shorter sides must sum to more than the longest."}, {"t": "10G", "q": "[para] Diagonal AC splits parallelogram ABCD into two triangles. Opposite sides are equal. Which test proves ABC ≅ CDA?", "a": ["SSS", "AAA", "RHS", "No test"], "e": "AB=CD, BC=DA and AC is shared."}, {"t": "10G", "q": "[kite] In kite ABCD, AB=AD and CB=CD. Why are ABC and ADC congruent?", "a": ["SSS, because AC is shared", "AAA only", "They have different sizes", "No information is available"], "e": "Three matching side pairs establish congruence."}, {"t": "10G", "q": "[para] Diagonals intersect at O. If AO = 6 cm, what is OC?", "a": ["6 cm", "12 cm", "3 cm", "Cannot tell"], "e": "Parallelogram diagonals bisect each other."}, {"t": "10G", "q": "[kite] What angle do the diagonals of a kite form?", "a": ["90°", "45°", "60°", "180°"], "e": "Kite diagonals are perpendicular."}, {"t": "10H", "q": "What must be true of similar figures?", "a": ["Corresponding angles equal and sides proportional", "All sides equal in length", "Areas equal", "Perimeters equal"], "e": "Similarity preserves shape, not necessarily size."}, {"t": "10H", "q": "A 3 cm side corresponds to a 9 cm side. What is the enlargement scale factor?", "a": ["3", "6", "1/3", "27"], "e": "9 ÷ 3 = 3."}, {"t": "10H", "q": "Which rectangle is similar to a 4 by 6 rectangle?", "a": ["8 by 12", "8 by 10", "4 by 8", "6 by 6"], "e": "Both corresponding sides are multiplied by 2."}, {"t": "10H", "q": "If ABCD is similar to WXYZ, which side corresponds to CD?", "a": ["YZ", "WX", "XY", "ZW"], "e": "Match vertices in the stated order."}, {"t": "10I", "q": "Two triangles have angles 40°, 60°, 80°. Which similarity test applies?", "a": ["AAA", "SSS", "RHS", "SAS"], "e": "Matching angles establish similarity."}, {"t": "10I", "q": "Triangles have sides 3, 4, 5 and 6, 8, 10. Which similarity test applies?", "a": ["SSS", "AAA", "SAS", "RHS only"], "e": "All corresponding side ratios equal 2."}, {"t": "10I", "q": "Two triangles have sides 3 and 5 around a 60° angle, and 6 and 10 around a 60° angle. Which similarity test applies?", "a": ["SAS", "AAA", "RHS", "None"], "e": "Two proportional sides and equal included angle establish similarity."}, {"t": "10I", "q": "Right triangles have hypotenuses 5 and 15 and corresponding legs 3 and 9. Which similarity test applies?", "a": ["RHS", "AAA only", "SAS only", "None"], "e": "Hypotenuses and corresponding legs are proportional."}, {"t": "10I", "q": "Similar triangles have corresponding sides 4 and 10. Another side of the smaller triangle is 6. What is the matching larger side?", "a": ["15", "12", "16", "24"], "e": "Scale factor is 10/4 = 2.5; 6 × 2.5 = 15."}]; const names={'8A':'Interpreting graphs and tables','8B':'Frequency tables and tallies','8C':'Graphs of frequency tables','8D':'Measures of centre','8E':'Measures of spread','8G':'Probability','10A':'Reflection','10B':'Translation','10C':'Rotation','10D':'Congruent figures','10E':'Congruent triangles','10G':'Congruence and quadrilaterals','10H':'Similar figures','10I':'Similar triangles'};const levels=[[{"t": "8A", "q": "Which is categorical data?", "a": ["Eye colour", "Height", "Age", "Mass"], "e": "Categories are labels, not measurements."}, {"t" · ${ok(q,i)?'CORRECT':'INCORRECT'}</div>${question(q)}<p>Your answer: ${ans[i]===null?'Not answered':esc(q.opts[ans[i]].v)}</p><p><b>Correct answer: ${esc(q.a[0])}</b></p><p>${esc(q.e)}</p></section>`).join('')}`;window.scrollTo(0,0)}async function nextLevel(){if(level<2){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();}catch(e){alert("Please allow fullscreen and try again.");return;}level++;startLevel()}}let active=false,violations=0,pendingWarning=false;for(const event of ['copy','cut','paste','contextmenu','dragstart'])document.addEventListener(event,e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','v','x','a','s','p'].includes(e.key.toLowerCase())&&active)e.preventDefault()});const shield=document.createElement('div');shield.hidden=true;shield.style.cssText='position:fixed;inset:0;z-index:99999;background:#101827;color:white;padding:12vh 24px;text-align:center;';shield.innerHTML='<h1>Exam mode paused</h1><p id="warningText"></p><button id="resumeExam">Return to fullscreen quiz</button>';document.body.append(shield);let away=false;function violation(){if(!active||away)return;away=true;admin.hidden=true;adminOpen=false;adminUnlocked=false;violations++;shield.hidden=false;app.style.visibility='hidden';document.querySelector('#warningText').textContent=`Exam violation detected. Your level is being submitted.`;if(violations>=1){app.style.visibility='';submitQuiz(true);}}document.querySelector('#resumeExam').onclick=async()=>{if(!active)return;try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();if(document.hidden||!document.hasFocus())return;away=false;shield.hidden=true;app.style.visibility='';tick();}catch(e){alert('Please allow fullscreen to continue.')}};document.addEventListener('visibilitychange',()=>{if(document.hidden)violation()});window.addEventListener('blur',violation);document.addEventListener('fullscreenchange',()=>{if(!document.fullscree .ctrlKey&&!e.metaKey&&e.key.toLowerCase()==='c'&&!(e.target.tagName==='TEXTAREA'||(e.target.tagName==='INPUT'&&e.target.type!=='radio'))){e.preventDefault();openAdmin();}if(adminOpen&&e.key==='Enter'&&e.target.id==='adminPass')unlockAdmin();});home();</script></html>
